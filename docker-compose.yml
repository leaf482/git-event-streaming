x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-observability-env: &observability-env
  GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
  GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
  GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s/grafana/}"
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-true}"
  GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
  GF_USERS_ALLOW_SIGN_UP: "false"

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.10
    container_name: github-pulse-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "${REDPANDA_MEMORY:-768M}"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "internal://0.0.0.0:9092,external://0.0.0.0:19092"
      - --advertise-kafka-addr
      - "internal://redpanda:9092,external://localhost:9092"
      - --rpc-addr
      - "0.0.0.0:33145"
      - --advertise-rpc-addr
      - "redpanda:33145"
    ports:
      - "127.0.0.1:9092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDPANDA_MEM_LIMIT:-1g}
    cpus: ${REDPANDA_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka-init:
    image: redpandadata/redpanda:v24.2.10
    container_name: github-pulse-kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create github.events.raw.v1 -X brokers=redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic alter-config github.events.raw.v1 -X brokers=redpanda:9092 --set retention.ms=604800000 || true
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: github-pulse-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    cpus: ${REDIS_CPUS:-0.25}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: github-pulse-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-github_pulse}"
      POSTGRES_USER: "${POSTGRES_USER:-github_pulse}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-github_pulse}"
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-50}"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-pulse-ingestor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    ports:
      - "${INGESTOR_HOST_BIND:-0.0.0.0}:8080:8080"
    environment:
      SERVICE_NAME: "${SERVICE_NAME:-github-events-ingestor}"
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      HTTP_ADDR: "${HTTP_ADDR:-:8080}"
      GITHUB_EVENTS_API_URL: "${GITHUB_EVENTS_API_URL:-https://api.github.com/events}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_USER_AGENT: "${GITHUB_USER_AGENT:-github-pulse-ingestor}"
      POLL_INTERVAL: "${POLL_INTERVAL:-15s}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-10s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-redpanda:9092}"
      KAFKA_TOPIC_GITHUB_EVENTS: "${KAFKA_TOPIC_GITHUB_EVENTS:-github.events.raw.v1}"
      KAFKA_CLIENT_ID: "${KAFKA_CLIENT_ID:-github-events-ingestor}"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${INGESTOR_MEM_LIMIT:-128m}
    cpus: ${INGESTOR_CPUS:-0.25}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-pulse-consumer
    entrypoint: ["/app/consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${CONSUMER_HOST_BIND:-0.0.0.0}:8081:8081"
    environment:
      SERVICE_NAME: "${CONSUMER_SERVICE_NAME:-github-events-consumer}"
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      HTTP_ADDR: "${CONSUMER_HTTP_ADDR:-:8081}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-10s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-redpanda:9092}"
      KAFKA_TOPIC_GITHUB_EVENTS: "${KAFKA_TOPIC_GITHUB_EVENTS:-github.events.raw.v1}"
      KAFKA_CLIENT_ID: "${CONSUMER_KAFKA_CLIENT_ID:-github-events-consumer}"
      KAFKA_GROUP_ID: "${KAFKA_GROUP_ID:-github-events-consumer}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      POSTGRES_ENABLED: "${POSTGRES_ENABLED:-true}"
      POSTGRES_DSN: "${POSTGRES_DSN:-postgres://github_pulse:github_pulse@postgres:5432/github_pulse?sslmode=disable}"
      PERSISTENCE_QUEUE_SIZE: "${PERSISTENCE_QUEUE_SIZE:-1000}"
      PERSISTENCE_WORKERS: "${PERSISTENCE_WORKERS:-1}"
      REPLAY_MODE: "${REPLAY_MODE:-false}"
      REPLAY_RATE_LIMIT: "${REPLAY_RATE_LIMIT:-0}"
      REPLAY_MAX_MESSAGES: "${REPLAY_MAX_MESSAGES:-0}"
      IDEMPOTENCY_TTL: "${IDEMPOTENCY_TTL:-72h}"
      TRENDING_WINDOW_SIZE: "${TRENDING_WINDOW_SIZE:-5m}"
      TRENDING_WINDOW_TTL: "${TRENDING_WINDOW_TTL:-2h}"
      TRENDING_LIMIT: "${TRENDING_LIMIT:-10}"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CONSUMER_MEM_LIMIT:-128m}
    cpus: ${CONSUMER_CPUS:-0.25}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: github-pulse-frontend
    depends_on:
      ingestor:
        condition: service_healthy
      consumer:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_BIND:-0.0.0.0}:3000:3000"
    environment:
      CONSUMER_API_BASE_URL: "http://consumer:8081"
      INGESTOR_API_BASE_URL: "http://ingestor:8080"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: github-pulse-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-/prometheus/}"
      - "--web.route-prefix=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_HOST_BIND:-127.0.0.1}:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      ingestor:
        condition: service_healthy
      consumer:
        condition: service_healthy
      redis-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
      kafka-exporter:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-384m}
    cpus: ${PROMETHEUS_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/prometheus/-/ready >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: github-pulse-grafana
    environment: *observability-env
    ports:
      - "${GRAFANA_HOST_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: github-pulse-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_EXPORTER_MEM_LIMIT:-64m}
    cpus: ${REDIS_EXPORTER_CPUS:-0.1}

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: github-pulse-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-github_pulse}:${POSTGRES_PASSWORD:-github_pulse}@postgres:5432/${POSTGRES_DB:-github_pulse}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT:-64m}
    cpus: ${POSTGRES_EXPORTER_CPUS:-0.1}

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: github-pulse-kafka-exporter
    command:
      - "--kafka.server=redpanda:9092"
      - "--web.listen-address=:9308"
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${KAFKA_EXPORTER_MEM_LIMIT:-96m}
    cpus: ${KAFKA_EXPORTER_CPUS:-0.1}

  caddy:
    image: caddy:2.8.4-alpine
    container_name: github-pulse-caddy
    ports:
      - "${CADDY_HTTP_HOST_BIND:-0.0.0.0}:80:80"
      - "${CADDY_ADMIN_HOST_BIND:-127.0.0.1}:2019:2019"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    cpus: ${CADDY_CPUS:-0.25}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  k6:
    image: grafana/k6:0.54.0
    container_name: github-pulse-k6
    profiles: ["tools"]
    volumes:
      - ./ops/k6:/scripts:ro
    depends_on:
      caddy:
        condition: service_healthy
    entrypoint: ["k6"]
    logging: *default-logging

volumes:
  redpanda-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
