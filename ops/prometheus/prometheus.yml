global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestor:8080"]

  - job_name: consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["consumer:8081"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: kafka-lag
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

